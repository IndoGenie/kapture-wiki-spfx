
name: Build Kapture Wiki SPFx Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Kapture-Wiki-SPFx-Corrected-Source-v2.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.19.0'

      - name: Verify source ZIP
        run: |
          ls -lah
          test -f Kapture-Wiki-SPFx-Corrected-Source-v2.zip

      - name: Extract source
        run: |
          unzip -q Kapture-Wiki-SPFx-Corrected-Source-v2.zip -d source
          test -f source/Kapture-Wiki-SPFx-Prototype/package.json

      - name: Install dependencies
        working-directory: source/Kapture-Wiki-SPFx-Prototype
        run: npm install --no-audit --no-fund

      - name: Clean project
        working-directory: source/Kapture-Wiki-SPFx-Prototype
        run: npx gulp clean

      - name: Build SPFx solution
        working-directory: source/Kapture-Wiki-SPFx-Prototype
        run: npx gulp bundle --ship

      - name: Package SharePoint application
        working-directory: source/Kapture-Wiki-SPFx-Prototype
        run: npx gulp package-solution --ship

      - name: Verify generated package
        working-directory: source/Kapture-Wiki-SPFx-Prototype
        run: |
          test -s sharepoint/solution/kapture-wiki.sppkg
          ls -lh sharepoint/solution/kapture-wiki.sppkg

      - name: Upload SPFx package
        uses: actions/upload-artifact@v4
        with:
          name: Kapture-Wiki-SharePoint-Package
          path: source/Kapture-Wiki-SPFx-Prototype/sharepoint/solution/kapture-wiki.sppkg
          if-no-files-found: error
