
name: Build Kapture Wiki SPFx Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Kapture-Wiki-SPFx-Corrected-Source-*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.19.0'

      - name: Verify source ZIP
        id: source
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname 'Kapture-Wiki-SPFx-Corrected-Source-*.zip' \
            | sort -V | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Kapture Wiki source ZIP found."
            exit 1
          fi

          echo "Using source: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract source
        run: |
          mkdir -p source
          unzip -q "${{ steps.source.outputs.zip_file }}" -d source

      - name: Locate SPFx project
        id: project
        shell: bash
        run: |
          PACKAGE_FILE=$(find source -name package.json -print -quit)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Clean project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: npx gulp clean

      - name: Build SPFx solution
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: npx gulp bundle --ship

      - name: Package SharePoint application
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: npx gulp package-solution --ship

      - name: Verify generated package
        id: package
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          SPPKG=$(find sharepoint/solution -maxdepth 1 \
            -type f -name '*.sppkg' -print -quit)

          if [ -z "$SPPKG" ] || [ ! -s "$SPPKG" ]; then
            echo "ERROR: SPFx package was not generated."
            exit 1
          fi

          echo "Generated package:"
          ls -lh "$SPPKG"
          echo "package_path=$SPPKG" >> "$GITHUB_OUTPUT"

      - name: Upload SPFx package
        uses: actions/upload-artifact@v4
        with:
          name: Kapture-Wiki-SharePoint-Package
          path: ${{ steps.project.outputs.project_dir }}/${{ steps.package.outputs.package_path }}
          if-no-files-found: error
          retention-days: 14
