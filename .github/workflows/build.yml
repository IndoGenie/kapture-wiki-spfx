name: Build Kapture Wiki SPFx Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.19.0'

      - name: Find source ZIP
        id: source
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No source ZIP found"
            exit 1
          fi
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract source
        run: |
          mkdir source
          unzip -q "${{ steps.source.outputs.zip_file }}" -d source

      - name: Locate SPFx project
        id: project
        run: |
          PROJECT=$(find source -name package.json -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "SPFx package.json not found"
            exit 1
          fi
          echo "project_dir=$(dirname "$PROJECT")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install AJV compatibility dependency
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: npm install --no-save --legacy-peer-deps ajv@^8

      - name: Clean project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: npx gulp clean

      - name: Build SPFx solution
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: npx gulp bundle --ship

      - name: Package SharePoint application
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: npx gulp package-solution --ship

      - name: Verify generated package
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          test -s sharepoint/solution/kapture-wiki.sppkg
          ls -lh sharepoint/solution/kapture-wiki.sppkg

      - name: Upload SPFx package
        uses: actions/upload-artifact@v4
        with:
          name: Kapture-Wiki-SharePoint-Package
          path: ${{ steps.project.outputs.project_dir }}/sharepoint/solution/kapture-wiki.sppkg
          if-no-files-found: error
