name: Build Kapture Wiki SPFx Package

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print | sort | head -n 1)"
          if [ -z "$SOURCE_ZIP" ]; then
            echo "No source ZIP found in the repository root." >&2
            exit 1
          fi
          mkdir -p source
          unzip -q "$SOURCE_ZIP" -d source
          PROJECT_DIR="$(find source -mindepth 1 -maxdepth 4 -type f -name package.json -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "The ZIP does not contain a project package.json." >&2
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT_DIR"
          test -f "$PROJECT_DIR/config/package-solution.json"
          test -f "$PROJECT_DIR/src/webparts/kaptureWiki/KaptureWikiWebPart.manifest.json"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.19.0'

      - name: Install dependencies
        run: cd "$PROJECT_DIR" && npm install --no-audit --no-fund

      - name: Clean project
        run: cd "$PROJECT_DIR" && npx gulp clean

      - name: Build SPFx solution
        run: cd "$PROJECT_DIR" && npx gulp bundle --ship

      - name: Package SharePoint application
        run: cd "$PROJECT_DIR" && npx gulp package-solution --ship

      - name: Verify generated package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="$PROJECT_DIR/sharepoint/solution/kapture-wiki.sppkg"
          test -s "$PACKAGE"
          ls -lh "$PACKAGE"

      - name: Upload SPFx package artifact
        uses: actions/upload-artifact@v4
        with:
          name: kapture-wiki-sppkg
          path: ${{ env.PROJECT_DIR }}/sharepoint/solution/kapture-wiki.sppkg
          if-no-files-found: error
          retention-days: 14
