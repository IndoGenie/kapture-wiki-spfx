
name: Build Kapture Wiki SPFx Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Kapture-Wiki-SPFx-Corrected-Source-*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.19.0'

      - name: Find and verify source ZIP
        id: source
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -name 'Kapture-Wiki-SPFx-Corrected-Source-*.zip' \
            | sort -V | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found."
            exit 1
          fi

          echo "Selected: $ZIP_FILE"
          unzip -t "$ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract source
        shell: bash
        run: |
          mkdir -p source
          unzip -q "${{ steps.source.outputs.zip_file }}" -d source

          PROJECT_DIR=$(find source -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: SPFx project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Install dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npm install --no-audit --no-fund

      - name: Clean project
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npx gulp clean

      - name: Build SPFx solution
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npx gulp bundle --ship

      - name: Package SharePoint application
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npx gulp package-solution --ship

      - name: Verify generated package
        shell: bash
        run: |
          PACKAGE="$PROJECT_DIR/sharepoint/solution/kapture-wiki.sppkg"

          if [ ! -s "$PACKAGE" ]; then
            echo "ERROR: SPFx package was not generated."
            exit 1
          fi

          ls -lh "$PACKAGE"

      - name: Upload SPFx package
        uses: actions/upload-artifact@v4
        with:
          name: Kapture-Wiki-SharePoint-Package
          path: ${{ env.PROJECT_DIR }}/sharepoint/solution/kapture-wiki.sppkg
          if-no-files-found: error
